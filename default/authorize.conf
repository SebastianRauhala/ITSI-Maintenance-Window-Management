#   ITSI Maintenance Window Management - authorize.conf
#
# A single custom capability is defined to group app-level administration and to
# gate the app-owned KV Store state collection (see metadata/default.meta). The
# REAL enforcement of maintenance-window operations is ITSI's own native
# capabilities (read/write/delete_maintenance_calendar) plus ITSI object RBAC,
# evaluated against the runtime session key. See docs/ROLES.md.

[capability::manage_itsi_maintenance_windows]

# Example role: app management + read/write on the app's KV state collection.
# Assign this to operators, together with the ITSI capabilities/teams they need.
[role_itsi_maintenance_manager]
manage_itsi_maintenance_windows = enabled
list_settings = enabled
importRoles = user

# Example read-only role: gets read access to the app (and its KV state
# collection via metadata). Pair with ITSI read_maintenance_calendar for listing
# windows.
[role_itsi_maintenance_reader]
importRoles = user
