#   ITSI Maintenance Window Management - authorize.conf
#
# Custom capabilities for least-privilege delegation. These gate who may own /
# run the saved searches that call this app's alert action. The underlying ITSI
# REST layer additionally enforces its own native capabilities
# (read/write/delete_maintenance_calendar) using the runtime session key.

[capability::manage_itsi_maintenance_windows]

[capability::read_itsi_maintenance_windows]

[capability::create_itsi_maintenance_windows]

[capability::update_itsi_maintenance_windows]

[capability::delete_itsi_maintenance_windows]

# Convenience role: full management (read/create/update/cancel). Delete is a
# separate capability and is NOT granted here by default.
[role_itsi_maintenance_manager]
manage_itsi_maintenance_windows = enabled
read_itsi_maintenance_windows = enabled
create_itsi_maintenance_windows = enabled
update_itsi_maintenance_windows = enabled
list_settings = enabled
importRoles = user

# Read-only role: can list/read maintenance windows via the app.
[role_itsi_maintenance_reader]
read_itsi_maintenance_windows = enabled
importRoles = user
