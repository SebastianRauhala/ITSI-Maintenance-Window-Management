#   ITSI Maintenance Window Management - example saved searches (DISABLED by default)
#
# These are examples only. They are disabled and use dry_run="true". Copy them
# into your own app/local and adjust before enabling. Replace <ENTITY_KEY> /
# <SERVICE_KEY> / timestamps with values from your environment.

[ITSI MW Automation - Example - Dry-run create (entity + service)]
disabled = 1
search = | makeresults \
| eval operation="create", request_id="MW-DEMO-001", group_id="MW-DEMO-001", change_id="CHG-DEMO-001", requested_by="itsi-maintenance-test", title="CHG-DEMO-001 - ITSI maintenance automation test", comment="Temporary live validation window", object_key="<ENTITY_KEY>", object_type="entity", start_time="<VALIDATED_UTC_START>", end_time="<VALIDATED_UTC_END>", dry_run="true" \
| append [ | makeresults \
    | eval operation="create", request_id="MW-DEMO-001", group_id="MW-DEMO-001", change_id="CHG-DEMO-001", requested_by="itsi-maintenance-test", title="CHG-DEMO-001 - ITSI maintenance automation test", comment="Temporary live validation window", object_key="<SERVICE_KEY>", object_type="service", start_time="<VALIDATED_UTC_START>", end_time="<VALIDATED_UTC_END>", dry_run="true" ] \
| fields operation request_id group_id change_id requested_by title comment object_key object_type start_time end_time dry_run
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
action.itsi_maintenance_action = 1
action.itsi_maintenance_action.param.default_dry_run = true

[ITSI MW Automation - Example - List windows]
disabled = 1
search = | makeresults | eval operation="list", request_id="MW-LIST-001"
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
action.itsi_maintenance_action = 1
action.itsi_maintenance_action.param.default_dry_run = true
