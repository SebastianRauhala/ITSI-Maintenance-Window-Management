#   ITSI Maintenance Window Management - app.conf
[id]
name = itsi_maintenance_window_management
version = 1.1.0

[install]
is_configured = 0
state = enabled

[package]
id = itsi_maintenance_window_management
check_for_updates = 0

[ui]
is_visible = 1
label = ITSI Maintenance Window Management

[launcher]
author = Sebastian Rauhala
description = Create, inspect, update, cancel and (optionally) delete ITSI maintenance windows from scheduled or ad hoc saved searches via a supported ITSI REST interface. Developer-supported; provided as-is with no warranty. Built with the assistance of generative AI.
version = 1.1.0

[triggers]
reload.itsi_mw_automation_state = simple
reload.itsi_maintenance = simple
