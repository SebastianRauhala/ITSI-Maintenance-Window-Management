#   ITSI Maintenance Window Management - commands.conf
#
# Chunked (v2 protocol) custom search command providing an interactive interface
# to ITSI maintenance windows. run_in_preview defaults to false for chunked
# commands, so this does NOT execute during search preview / on partial data.

[itsimaintenance]
filename = itsimaintenance.py
chunked = true
# Run only on the search head (it calls the local splunkd/ITSI REST API).
local = true
# Do not execute while the search is previewing (belt-and-suspenders; this is
# the default for chunked commands).
run_in_preview = false
python.required = 3.9,3.13
