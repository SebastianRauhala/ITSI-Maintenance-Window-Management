#   ITSI Maintenance Window Management - itsi_maintenance.conf
#
# Safety controls for the itsimaintenance custom search command. Override in
# local/ (never edit default/). Endpoint and security constants are fixed in
# code and are NOT configurable here.

[safety]
default_dry_run = true
enable_delete = false
allow_cancel_active = true
allow_modify_completed = false
require_change_id = false
auto_split_mixed = true
max_rows_per_invocation = 2000
max_objects_per_window = 1000
max_duration_seconds = 604800
max_future_horizon_seconds = 31536000
min_lead_seconds = 0
max_title_length = 256
max_comment_length = 1024
max_request_id_length = 128
allowed_operations = validate,list,create,update,cancel
allowed_object_types = entity,service
required_title_prefix =
protected_object_keys =
summary_index =
