#   ITSI Maintenance Window Management - collections.conf
#
# App-owned KV Store collection for idempotency and operation state.
# This is NOT an ITSI collection. It stores only sanitized operation metadata.

[itsi_mw_automation_state]
# enforceTypes is intentionally false: some fields are null before completion
# and itsi_window_keys/result hold arrays/objects.
enforceTypes = false
field.request_id = string
field.payload_hash = string
field.operation = string
field.state = string
field.first_seen = number
field.last_update = number
field.attempt_count = number
accelerated_fields.by_state = {"state": 1, "last_update": 1}
