#   ITSI Maintenance Window Management - alert_actions.conf
#
# Modular alert action that manages ITSI maintenance_calendar windows.
# All values below are safe defaults. Per-saved-search overrides are supplied as
# action.itsi_maintenance_action.param.<name> in savedsearches.conf.

[itsi_maintenance_action]
is_custom = 1
label = ITSI Maintenance Window Management
description = Create/inspect/update/cancel/delete ITSI maintenance windows via the supported ITSI REST API.
icon_path = appIcon.png
payload_format = json
python.required = 3.9,3.13
command = sendalert

## --- Behavior (safe defaults) ---
# Dry-run is ON by default. No writes occur until explicitly set to false.
param.default_dry_run = true
# Destructive delete is OFF by default.
param.enable_delete = false
# Cancelling an already-active window is allowed by default (set end_time=now).
param.allow_cancel_active = true
# Modifying a completed (past end_time) window is OFF by default.
param.allow_modify_completed = false
# Require a change_id on write operations.
param.require_change_id = false
# Auto-split a mixed entity+service request into separate windows (ITSI requires
# each window to be a single object type).
param.auto_split_mixed = true

## --- Limits ---
param.max_rows_per_invocation = 2000
param.max_objects_per_window = 1000
param.max_duration_seconds = 604800
param.max_future_horizon_seconds = 31536000
param.min_lead_seconds = 0
param.max_title_length = 256
param.max_comment_length = 1024
param.max_request_id_length = 128

## --- Allow-lists ---
param.allowed_operations = validate,list,create,update,cancel
param.allowed_object_types = entity,service
param.required_title_prefix =
param.protected_object_keys =

## --- Optional summary index (must already exist / be approved) ---
param.summary_index =
